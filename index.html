<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Budget Tracker</h1>
  <p>Track your income and expenses in one place.</p>

  <section id="add-expense">
    <h2>Add Expense</h2>

    <div class="input-group">
      <label for="expense-name">Expense name</label>
      <input type="text" id="expense-name" placeholder="e.g. Matatu fare">
    </div>

    <div class="input-group">
      <label for="expense-amount">Amount (KES)</label>
      <input type="number" id="expense-amount" placeholder="e.g. 100">
    </div>

    <div class="input-group">
      <label for="expense-category">Category</label>
      <select id="expense-category">
        <option value="">Choose a category</option>
        <option value="food">Food</option>
        <option value="transport">Transport</option>
        <option value="airtime">Airtime &amp; Data</option>
        <option value="rent">Rent</option>
        <option value="other">Other</option>
      </select>
    </div>

    <button type="button">Add Expense</button>
  </section>

  <section id="expense-list">
    <h2>Your Expenses</h2>
    <p class="placeholder-text">No expenses yet</p>
  </section>

</body>
</html>
